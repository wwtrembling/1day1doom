<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1일 1진화 — 30년 후 내 직업은</title>

    <meta name="description" content="AI 시대, 내 직업은 어떻게 진화할까? 30년 후 진화 트리를 카드로 받아보세요.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://1day1doom.com/ko/">
    <meta property="og:title" content="1일 1진화 — 30년 후 내 직업">
    <meta property="og:description" content="AI 시대, 내 직업은 어떻게 진화할까? 포켓몬식 3단 진화 카드로 보여드립니다.">
    <meta property="og:image" content="https://1day1doom.com/public/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6334819180242631"
     crossorigin="anonymous"></script>

    <link rel="stylesheet" href="../style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1 class="evo-title" data-i18n="app_title">1일 1진화</h1>
            <p id="slogan" class="evo-subtitle" data-i18n="slogan">AI가 내 직업을 먹기 전에, 내가 먼저 진화한다.</p>
            <div class="lang-switch">
                <a href="../ko/index.html" id="btn-ko" class="evo-btn-mini active">KO</a>
                <a href="../en/index.html" id="btn-en" class="evo-btn-mini">EN</a>
            </div>
        </header>

        <main>
            <section id="input-section" class="panel">
                <h2 data-i18n="input_title">내 직업 입력</h2>
                <form id="job-form" autocomplete="off">
                    <div class="form-group">
                        <label for="job-input" data-i18n="label_job">직업</label>
                        <input type="text" id="job-input" required
                               placeholder="예: 백엔드 개발자, 교사, 간호사…"
                               data-i18n-placeholder="placeholder_job">
                        <ul id="job-suggestions" class="suggest-list"></ul>
                    </div>
                    <button type="submit" class="evo-btn primary" data-i18n="btn_submit">진화 트리 보기</button>
                </form>
                <p class="hint" data-i18n="hint">
                    내 직업이 30년 동안 어떻게 진화할지, AI 시대에 어떻게 살아남을지 보여드려요.
                </p>
            </section>

            <section id="loading-section" class="panel hidden">
                <div class="loading-content">
                    <h2 class="animate-pulse" data-i18n="msg_calculating">진화 트리 분석 중…</h2>
                    <div class="evo-spinner">✨</div>
                </div>
            </section>

            <section id="result-section" class="panel hidden">
                <div class="result-header">
                    <p class="result-job-label">
                        <span data-i18n="result_job_label">내 직업</span>:
                        <strong id="result-job-name">…</strong>
                    </p>
                    <h2 id="result-caption" class="result-caption">…</h2>
                </div>

                <div id="evolution-cards" class="evolution-cards">
                    <!-- 3 cards injected by JS -->
                </div>

                <div class="action-buttons">
                    <button id="btn-share" class="evo-btn secondary" data-i18n="btn_share">친구에게 공유</button>
                    <button id="btn-restart" class="evo-btn ghost" data-i18n="btn_retry">다른 직업으로</button>
                </div>
            </section>
        </main>

        <footer>
            <p>© 1일 1진화 · Made with care for the AI generation</p>
        </footer>
    </div>

    <script src="../app.js"></script>
</body>

</html>
