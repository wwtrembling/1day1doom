<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1 Day 1 Evolve — Your Career, 30 Years From Now</title>

    <meta name="description" content="In the age of AI, how will your career evolve? Get your 3-stage evolution card.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://1day1doom.com/en/">
    <meta property="og:title" content="1 Day 1 Evolve — Your Career, 30 Years From Now">
    <meta property="og:description" content="In the age of AI, how will your career evolve? Get your 3-stage evolution card.">
    <meta property="og:image" content="https://1day1doom.com/public/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6334819180242631"
     crossorigin="anonymous"></script>

    <link rel="stylesheet" href="../style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1 class="evo-title" data-i18n="app_title">1 Day 1 Evolve</h1>
            <p id="slogan" class="evo-subtitle" data-i18n="slogan">Before AI eats your job, evolve first.</p>
            <div class="lang-switch">
                <a href="../ko/index.html" id="btn-ko" class="evo-btn-mini">KO</a>
                <a href="../en/index.html" id="btn-en" class="evo-btn-mini active">EN</a>
            </div>
        </header>

        <main>
            <section id="input-section" class="panel">
                <h2 data-i18n="input_title">Your Job</h2>
                <form id="job-form" autocomplete="off">
                    <div class="form-group">
                        <label for="job-input" data-i18n="label_job">Job</label>
                        <input type="text" id="job-input" required
                               placeholder="e.g. Backend Developer, Teacher, Nurse…"
                               data-i18n-placeholder="placeholder_job">
                        <ul id="job-suggestions" class="suggest-list"></ul>
                    </div>
                    <button type="submit" class="evo-btn primary" data-i18n="btn_submit">See My Evolution Tree</button>
                </form>
                <p class="hint" data-i18n="hint">
                    See how your career evolves over 30 years and how to thrive in the age of AI.
                </p>
            </section>

            <section id="loading-section" class="panel hidden">
                <div class="loading-content">
                    <h2 class="animate-pulse" data-i18n="msg_calculating">Analyzing your evolution tree…</h2>
                    <div class="evo-spinner">✨</div>
                </div>
            </section>

            <section id="result-section" class="panel hidden">
                <div class="result-header">
                    <p class="result-job-label">
                        <span data-i18n="result_job_label">Your job</span>:
                        <strong id="result-job-name">…</strong>
                    </p>
                    <h2 id="result-caption" class="result-caption">…</h2>
                </div>

                <div id="evolution-cards" class="evolution-cards">
                    <!-- 3 cards injected by JS -->
                </div>

                <div class="action-buttons">
                    <button id="btn-share" class="evo-btn secondary" data-i18n="btn_share">Share</button>
                    <button id="btn-restart" class="evo-btn ghost" data-i18n="btn_retry">Try Another Job</button>
                </div>
            </section>
        </main>

        <footer>
            <p>© 1 Day 1 Evolve · Made with care for the AI generation</p>
        </footer>
    </div>

    <script src="../app.js"></script>
</body>

</html>
