</head>

<body>
    <div class="container">
        <header>
            <h1 class="evo-title" data-i18n="app_title">1Day1Doom</h1>
            <p id="slogan" class="evo-subtitle" data-i18n="slogan">AI 會吃掉你的工作嗎？— 5 題診斷你 30 年後的兩條命運</p>
            <div class="lang-switch">
                <a href="../ko/index.html" class="evo-btn-mini">KO</a>
                <a href="../en/index.html" class="evo-btn-mini">EN</a>
                <a href="../ja/index.html" class="evo-btn-mini">JA</a>
                <a href="../zh-tw/index.html" class="evo-btn-mini active">繁</a>
                <a href="../es/index.html" class="evo-btn-mini">ES</a>
                <a href="../de/index.html" class="evo-btn-mini">DE</a>
            </div>
        </header>

        <main>
            <section id="input-section" class="panel">
                <h2 data-i18n="input_title">輸入你的職業</h2>
                <form id="job-form" autocomplete="off">
                    <div class="form-group">
                        <label for="job-input" data-i18n="label_job">職業</label>
                        <input type="text" id="job-input" required
                               placeholder="例：後端工程師、教師、護理師…"
                               data-i18n-placeholder="placeholder_job">
                        <ul id="job-suggestions" class="suggest-list"></ul>
                    </div>
                </form>
                <p class="hint" data-i18n="hint">
                    選擇職業，回答 5 題，結果會在同一頁顯示。
                </p>
            </section>

            <section id="quiz-section" class="panel hidden">
                <h2 class="quiz-title" data-i18n="quiz_title">5 題診斷</h2>
                <p class="quiz-intro" data-i18n="quiz_intro">AI 時代，你站在哪裡？</p>
                <div id="quiz-questions"></div>
                <div class="ad-slot ad-slot-quiz" aria-hidden="true">
                    <ins class="adsbygoogle"
                         style="display:block"
                         data-ad-client="ca-pub-6334819180242631"
                         data-ad-slot="0000000001"
                         data-ad-format="auto"
                         data-full-width-responsive="true"></ins>
                </div>
            </section>

            <section id="result-section" class="panel hidden">
                <div class="result-header">
                    <p class="result-job-label">
                        <span data-i18n="result_job_label">你的職業</span>:
                        <strong id="result-job-name">…</strong>
                    </p>
                    <h2 id="hook-copy" class="result-caption">…</h2>
                </div>

                <div class="persona-card">
                    <div class="persona-card-label" data-i18n="persona_card_title">你的分身</div>
                    <div class="persona-emoji-big" id="persona-emoji">✨</div>
                    <h3 id="persona-nickname" class="persona-nickname">…</h3>
                    <p id="persona-blurb" class="persona-blurb">…</p>
                    <p class="persona-bias">
                        <span data-i18n="bias_label">你的自然結局</span>:
                        <strong id="persona-bias-path">…</strong>
                    </p>
                </div>

                <div class="ad-slot ad-slot-result-top" aria-hidden="true">
                    <ins class="adsbygoogle"
                         style="display:block"
                         data-ad-client="ca-pub-6334819180242631"
                         data-ad-slot="0000000002"
                         data-ad-format="auto"
                         data-full-width-responsive="true"></ins>
                </div>

                <div class="year0-frame">
                    <div id="year0-card" class="evo-card stage-0 path-year0"></div>
                </div>

                <div class="dual-tree">
                    <div id="doom-tree-wrap" class="path-tree path-tree-doom">
                        <div class="path-tree-header">
                            <h3 id="doom-tree-title" class="path-tree-title">DOOM PATH</h3>
                            <p id="doom-tree-desc" class="path-tree-desc">AI 接手位置的路徑</p>
                        </div>
                        <div id="doom-tree" class="path-tree-stages"></div>
                    </div>

                    <div id="bloom-tree-wrap" class="path-tree path-tree-bloom">
                        <div class="path-tree-header">
                            <h3 id="bloom-tree-title" class="path-tree-title">BLOOM PATH</h3>
                            <p id="bloom-tree-desc" class="path-tree-desc">與 AI 共同進化的路徑</p>
                        </div>
                        <div id="bloom-tree" class="path-tree-stages"></div>
                    </div>
                </div>

                <div class="ad-slot ad-slot-result-mid" aria-hidden="true">
                    <ins class="adsbygoogle"
                         style="display:block"
                         data-ad-client="ca-pub-6334819180242631"
                         data-ad-slot="0000000003"
                         data-ad-format="auto"
                         data-full-width-responsive="true"></ins>
                </div>

                <div class="action-buttons">
                    <button id="btn-share" class="evo-btn secondary" data-i18n="btn_share">分享結果</button>
                    <button id="btn-other-persona" class="evo-btn" data-i18n="btn_other_persona">看其他角色</button>
                    <button id="btn-restart" class="evo-btn ghost" data-i18n="btn_restart_quiz">換一個職業</button>
                </div>

                <div class="ad-slot ad-slot-result-bottom" aria-hidden="true">
                    <ins class="adsbygoogle"
                         style="display:block"
                         data-ad-client="ca-pub-6334819180242631"
                         data-ad-slot="0000000004"
                         data-ad-format="auto"
                         data-full-width-responsive="true"></ins>
                </div>
            </section>
        </main>

        <footer>
            <p>© 1Day1Doom · AI 時代的職業診斷</p>
        </footer>
    </div>

</body>

</html>
